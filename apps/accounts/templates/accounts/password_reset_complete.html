{% extends 'base.html' %}
{% block title %}Password Changed{% endblock %}
{% block content %}
<div class="fc-auth-wrapper">
  <div class="fc-auth-card text-center">
    <div style="width:72px;height:72px;background:#E8F5E9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:2rem;color:var(--fc-primary);" aria-hidden="true">
      <i class="bi bi-check-circle-fill"></i>
    </div>
    <h1 class="fc-auth-title">Password Changed!</h1>
    <p style="font-size:0.9375rem;color:var(--fc-text-muted);margin-bottom:1.75rem;line-height:1.7;">
      Your password has been successfully changed. You can now sign in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg w-100 btn-icon">
      <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
      Sign In Now
    </a>
  </div>
</div>
{% endblock %}
